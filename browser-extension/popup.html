<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>KMP Hub — ImmiAccount Autofill</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        width: 300px;
        padding: 16px;
        color: #2c2c2c;
      }
      h1 {
        font-size: 14px;
        font-weight: 700;
        margin: 0 0 4px;
      }
      p.sub {
        font-size: 12px;
        color: #2c2c2c99;
        margin: 0 0 12px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        font-size: 12px;
        border: 1px solid #00000022;
        border-radius: 6px;
        margin-bottom: 8px;
      }
      button {
        width: 100%;
        padding: 8px;
        font-size: 13px;
        font-weight: 600;
        color: white;
        background: #f27b20;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .status {
        margin-top: 10px;
        font-size: 12px;
        padding: 8px;
        border-radius: 6px;
      }
      .status.ok {
        background: #e8f5e9;
        color: #2e7d32;
      }
      .status.off {
        background: #f5f5f5;
        color: #666;
      }
      a {
        color: #f27b20;
      }
    </style>
  </head>
  <body>
    <h1>KMP Hub — ImmiAccount Autofill</h1>
    <p class="sub">
      Cole aqui o token gerado em Configurações → Integrações no Hub.
    </p>
    <input id="tokenInput" type="password" placeholder="kmpx_..." autocomplete="off" />
    <button id="saveBtn">Salvar</button>
    <div id="status" class="status off">Carregando...</div>
    <p class="sub" style="margin-top: 12px">
      Depois de salvo, abra a tela de código do ImmiAccount — o campo
      preenche sozinho.
    </p>
  </body>
  <script src="popup.js"></script>
</html>
